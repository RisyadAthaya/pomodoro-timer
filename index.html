<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1 class="timer-title">Pomodoro Timer</h1>
    <section class="timer" aria-label="Pomodoro timer">
      <div class="timer-modes" role="group" aria-label="Timer modes">
        <button class="timer-mode is-active" type="button" data-mode="study" aria-pressed="true">Study</button>
        <button class="timer-mode" type="button" data-mode="short-break" aria-pressed="false">Short Break</button>
        <button class="timer-mode" type="button" data-mode="long-break" aria-pressed="false">Long Break</button>
      </div>
      <div class="timer-display" aria-live="polite" aria-atomic="true">
        <span id="timer-text">Timer</span>
      </div>
      <div class="timer-buttons">
        <button class="timer-button" type="button" aria-label="Start/Pause Timer Button">START</button>
        <button class="skip-timer-button" type="button" aria-label="Skip Timer Button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="skip-timer-svg"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M149 100.8C161.9 93.8 177.7 94.5 190 102.6L448 272.1L448 128C448 110.3 462.3 96 480 96C497.7 96 512 110.3 512 128L512 512C512 529.7 497.7 544 480 544C462.3 544 448 529.7 448 512L448 367.9L190 537.5C177.7 545.6 162 546.3 149 539.3C136 532.3 128 518.7 128 504L128 136C128 121.3 136.1 107.8 149 100.8z"/></svg>
        </button>
      </div>
    </section>
    <div class="task-list">
      <h2>Tasks</h2>
      <ul class="task-list-items">
        <li class="task-list-item">
          <p>Study Data Structures & Algorithms</p>
        </li>
        <li class="task-list-item">
          <p>Work on Portfolio Website</p>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
